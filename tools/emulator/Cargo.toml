# Copy this directory into the Ziddle ziddle-1793487371 workspace as fdbprobe/
# and add "fdbprobe" to workspace.members. Rename fdbprobe.rs to src/main.rs.
[package]
name = "fdbprobe"
version = "0.1.0"
edition = "2021"
[dependencies]
ziddle-effect-emulator.workspace = true
ziddle-effect-runtime.workspace = true

ziddle-firmware-analysis.workspace = true
serde_json.workspace = true

[[bin]]
name = "firmware_probe"
path = "src/bin/firmware_probe.rs"

[[bin]]
name = "firmware_init_probe"
path = "src/bin/firmware_init_probe.rs"
